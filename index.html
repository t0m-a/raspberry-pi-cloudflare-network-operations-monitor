<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Multi-Domain Network Operation Room</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 2rem; }
        h1 { margin-bottom: 0.4rem; }
        h2 { color: #e2e8f0; border-bottom: 1px solid #1e293b; padding-bottom: 0.5rem; margin-top: 2.5rem; }
        .domain-section { margin-bottom: 2.25rem; background: #111c30; padding: 1.5rem; border-radius: 12px; border: 1px solid #1e293b; }
        .domain-title { font-size: 1.4rem; color: #38bdf8; font-weight: bold; margin-top: 0; border-bottom: 2px solid #1e293b; padding-bottom: 0.5rem; display: flex; justify-content: space-between; align-items: center; }
        .subtitle-badge { font-size: 0.8rem; font-weight: normal; color: #94a3b8; background: #1e293b; padding: 0.25rem 0.65rem; border-radius: 999px; border: 1px solid #334155; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1.15rem; margin-top: 1rem; }
        .card { background: #1e293b; padding: 1.15rem; border-radius: 8px; border: 1px solid #334155; }
        .card h3 { margin: 0 0 0.6rem 0; font-size: 0.8rem; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.05em; }
        .metric { font-size: 1.6rem; font-weight: bold; color: #f97316; }
        .metric-sub { font-size: 0.8rem; color: #94a3b8; margin-top: 0.35rem; }
        .status-healthy { color: #22c55e; }
        .status-warn { color: #eab308; }
        .status-crit { color: #ef4444; }
        .progress-track { width: 100%; height: 6px; background: #0f172a; border-radius: 999px; overflow: hidden; margin-top: 0.5rem; }
        .progress-bar { height: 100%; border-radius: 999px; transition: width 0.3s ease; }
        .bg-healthy { background: #22c55e; }
        .bg-warn { background: #eab308; }
        .bg-crit { background: #ef4444; }
        .table-wrap { margin-top: 1.25rem; overflow-x: auto; }
        table.breakdown-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
        table.breakdown-table th { text-align: left; color: #94a3b8; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.04em; padding: 0.6rem 0.75rem; border-bottom: 1px solid #334155; background: #162238; }
        table.breakdown-table td { padding: 0.6rem 0.75rem; border-bottom: 1px solid #1e293b; color: #e2e8f0; }
        table.breakdown-table tr:last-child td { border-bottom: none; }
        .tag { display: inline-block; font-size: 0.72rem; padding: 0.12rem 0.45rem; border-radius: 4px; background: #0f172a; color: #38bdf8; border: 1px solid #1e3a5f; margin-left: 0.4rem; }
        .db-row { display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem; font-size: 0.9rem; border-bottom: 1px solid #334155; padding-bottom: 0.5rem; }
        #system-meta { font-size: 0.95rem; color: #94a3b8; margin-bottom: 2rem; }
    </style>
</head>
<body>
    <h1>Edge Network Operations</h1>
    <div id="system-meta">
        System Sync: <span id="last-updated">Connecting...</span> |
        Main Monitor: <span id="daemon-health" class="status-healthy">ONLINE</span> |
        Billing Cycle (UTC): <span id="billing-cycle">--</span>
    </div>

    <!-- Active domain groups append dynamically inside this container -->
    <div id="domains-container"></div>

    <!-- Account Billing & Platform Usage Sections -->
    <div id="workers-pages-container"></div>
    <div id="workers-ai-container"></div>

    <h2>D1 Database Clusters Billing &amp; Storage Limits</h2>
    <div id="d1-container"></div>

    <script>
        function getQuotaClass(pct) {
            if (pct >= 80) return 'status-crit';
            if (pct >= 60) return 'status-warn';
            return 'status-healthy';
        }

        function getProgressClass(pct) {
            if (pct >= 80) return 'bg-crit';
            if (pct >= 60) return 'bg-warn';
            return 'bg-healthy';
        }

        function clampPct(pct) {
            return Math.min(100, Math.max(0, Number(pct) || 0));
        }

        async function updateDashboard() {
            try {
                const response = await fetch('metrics.json?cache_bust=' + Date.now());
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();

                document.getElementById('last-updated').innerText = data.last_updated || 'Unknown';
                document.getElementById('daemon-health').innerText = "ONLINE";
                document.getElementById('daemon-health').className = "status-healthy";

                const bp = data.billing_period || {};
                document.getElementById('billing-cycle').innerText =
                    bp.month_start ? `${bp.month_start} → ${bp.current_date_utc}` : 'Current Month';

                // 1. Render Dynamic Domain Section Blocks
                const domainsContainer = document.getElementById('domains-container');
                domainsContainer.innerHTML = '';

                const domainEntries = Object.entries(data.domains || {});
                if (domainEntries.length === 0) {
                    domainsContainer.innerHTML = '<div class="domain-section"><p style="color:#94a3b8; margin:0;">No monitored domains found in metrics payload.</p></div>';
                }

                for (const [domainName, metrics] of domainEntries) {
                    const chrClass = metrics.cache_hit_ratio > 70 ? 'status-healthy' : 'status-warn';
                    const secClass = metrics.security_events > 0 ? 'status-crit' : 'status-healthy';
                    const errClass = metrics.errors_5xx > 0 ? 'status-crit' : 'status-healthy';
                    const statusClass = metrics.status === "HEALTHY" ? 'status-healthy' : 'status-crit';

                    domainsContainer.innerHTML += `
                        <div class="domain-section">
                            <div class="domain-title">
                                <span>${domainName}</span>
                                <span class="subtitle-badge">Edge Zone (Past 1h)</span>
                            </div>
                            <div class="grid">
                                <div class="card">
                                    <h3>Edge Routing Status</h3>
                                    <div class="metric ${statusClass}">${metrics.status}</div>
                                </div>
                                <div class="card">
                                    <h3>Traffic Vol (Past Hour)</h3>
                                    <div class="metric">${(metrics.hit_volume ?? 0).toLocaleString()}</div>
                                </div>
                                <div class="card">
                                    <h3>Bandwidth Ingestion</h3>
                                    <div class="metric">${metrics.bandwidth_gb ?? 0} GB</div>
                                </div>
                                <div class="card">
                                    <h3>Cache Hit Ratio</h3>
                                    <div class="metric ${chrClass}">${metrics.cache_hit_ratio ?? 0}%</div>
                                </div>
                                <div class="card">
                                    <h3>Threats Blocked</h3>
                                    <div class="metric ${secClass}">${metrics.security_events ?? 0}</div>
                                </div>
                                <div class="card">
                                    <h3>Origin Gateway Errors (5xx)</h3>
                                    <div class="metric ${errClass}">${metrics.errors_5xx ?? 0}</div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                // 2. Render Workers & Pages Billing & Usage
                const wp = data.workers_and_pages || {};
                const wpContainer = document.getElementById('workers-pages-container');
                const wpDailyPct = wp.daily_requests_pct ?? 0;
                const wpBuildPct = wp.monthly_build_minutes_pct ?? 0;
                const wpErrClass = (wp.mtd_errors ?? 0) > 0 ? 'status-warn' : 'status-healthy';

                let scriptsRowsHtml = '';
                (wp.scripts || []).forEach(s => {
                    const sErrClass = (s.errors_mtd ?? 0) > 0 ? 'status-crit' : 'status-healthy';
                    scriptsRowsHtml += `
                        <tr>
                            <td><strong>${s.name}</strong><span class="tag">${s.type || 'Worker'}</span></td>
                            <td>${(s.requests_today ?? 0).toLocaleString()}</td>
                            <td>${(s.requests_mtd ?? 0).toLocaleString()}</td>
                            <td>${(s.subrequests_mtd ?? 0).toLocaleString()}</td>
                            <td>${(s.cpu_time_ms_mtd ?? 0).toLocaleString()} ms</td>
                            <td class="${sErrClass}">${(s.errors_mtd ?? 0).toLocaleString()}</td>
                        </tr>
                    `;
                });

                let assetsRowsHtml = '';
                (wp.assets_hosts || []).forEach(a => {
                    assetsRowsHtml += `
                        <tr>
                            <td><strong>${a.hostname}</strong><span class="tag">Static Assets (Free)</span></td>
                            <td>${(a.requests_today ?? 0).toLocaleString()}</td>
                            <td>${(a.requests_mtd ?? 0).toLocaleString()}</td>
                        </tr>
                    `;
                });

                wpContainer.innerHTML = `
                    <div class="domain-section">
                        <div class="domain-title">
                            <span>Workers &amp; Pages Billing Usage</span>
                            <span class="subtitle-badge">Est. Billable MTD: $${(wp.estimated_billable_usd ?? 0).toFixed(2)}</span>
                        </div>
                        <div class="grid">
                            <div class="card">
                                <h3>Daily Requests (UTC Quota)</h3>
                                <div class="metric ${getQuotaClass(wpDailyPct)}">${(wp.daily_requests ?? 0).toLocaleString()}</div>
                                <div class="metric-sub">${wpDailyPct}% of ${(wp.daily_requests_limit ?? 100000).toLocaleString()} / day free</div>
                                <div class="progress-track"><div class="progress-bar ${getProgressClass(wpDailyPct)}" style="width:${clampPct(wpDailyPct)}%"></div></div>
                            </div>
                            <div class="card">
                                <h3>Worker Invocations (MTD)</h3>
                                <div class="metric">${((wp.mtd_worker_requests ?? 0) + (wp.mtd_pages_requests ?? 0)).toLocaleString()}</div>
                                <div class="metric-sub">Subrequests: ${(wp.mtd_subrequests ?? 0).toLocaleString()}</div>
                            </div>
                            <div class="card">
                                <h3>Static Assets Served (MTD)</h3>
                                <div class="metric status-healthy">${(wp.mtd_assets_requests ?? 0).toLocaleString()}</div>
                                <div class="metric-sub">Unlimited / Free Tier</div>
                            </div>
                            <div class="card">
                                <h3>Total CPU Time (MTD)</h3>
                                <div class="metric">${(wp.mtd_cpu_time_ms ?? 0).toLocaleString()} ms</div>
                                <div class="metric-sub">Errors MTD: <span class="${wpErrClass}">${(wp.mtd_errors ?? 0).toLocaleString()}</span></div>
                            </div>
                            <div class="card">
                                <h3>Workers Build Minutes (MTD)</h3>
                                <div class="metric ${getQuotaClass(wpBuildPct)}">${wp.mtd_build_minutes ?? 0} min</div>
                                <div class="metric-sub">${wpBuildPct}% of ${(wp.monthly_build_minutes_limit ?? 3000).toLocaleString()} min / mo</div>
                                <div class="progress-track"><div class="progress-bar ${getProgressClass(wpBuildPct)}" style="width:${clampPct(wpBuildPct)}%"></div></div>
                            </div>
                        </div>

                        <div class="table-wrap">
                            <table class="breakdown-table">
                                <thead>
                                    <tr>
                                        <th>Worker / Pages Script</th>
                                        <th>Requests (Today)</th>
                                        <th>Requests (MTD)</th>
                                        <th>Subrequests (MTD)</th>
                                        <th>CPU Time (MTD)</th>
                                        <th>Errors (MTD)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${scriptsRowsHtml || '<tr><td colspan="6" style="color:#94a3b8">No Worker or Pages scripts detected.</td></tr>'}
                                </tbody>
                            </table>
                        </div>

                        ${assetsRowsHtml ? `
                        <div class="table-wrap">
                            <table class="breakdown-table">
                                <thead>
                                    <tr>
                                        <th>Static Asset Hostname</th>
                                        <th>Asset Requests (Today)</th>
                                        <th>Asset Requests (MTD)</th>
                                    </tr>
                                </thead>
                                <tbody>${assetsRowsHtml}</tbody>
                            </table>
                        </div>` : ''}
                    </div>
                `;

                // 3. Render Workers AI Billing & Usage
                const ai = data.workers_ai || {};
                const aiContainer = document.getElementById('workers-ai-container');
                const aiDailyPct = ai.daily_neurons_pct ?? 0;

                let aiModelsHtml = '';
                (ai.models || []).forEach(m => {
                    aiModelsHtml += `
                        <tr>
                            <td><strong>${m.model_id}</strong></td>
                            <td>${(m.requests_today ?? 0).toLocaleString()}</td>
                            <td>${(m.requests_mtd ?? 0).toLocaleString()}</td>
                            <td>${(m.neurons_mtd ?? 0).toLocaleString()}</td>
                            <td>${(m.input_tokens_mtd ?? 0).toLocaleString()}</td>
                            <td>${(m.output_tokens_mtd ?? 0).toLocaleString()}</td>
                            <td>${((m.inference_time_ms_mtd ?? 0) / 1000).toFixed(2)} s</td>
                        </tr>
                    `;
                });

                aiContainer.innerHTML = `
                    <div class="domain-section">
                        <div class="domain-title">
                            <span>Workers AI Billing &amp; Neuron Usage</span>
                            <span class="subtitle-badge">Est. Billable MTD: $${(ai.estimated_billable_usd ?? 0).toFixed(4)}</span>
                        </div>
                        <div class="grid">
                            <div class="card">
                                <h3>Daily Neurons (UTC Quota)</h3>
                                <div class="metric ${getQuotaClass(aiDailyPct)}">${(ai.daily_neurons ?? 0).toLocaleString()}</div>
                                <div class="metric-sub">${aiDailyPct}% of ${(ai.daily_neurons_limit ?? 10000).toLocaleString()} free Neurons / day</div>
                                <div class="progress-track"><div class="progress-bar ${getProgressClass(aiDailyPct)}" style="width:${clampPct(aiDailyPct)}%"></div></div>
                            </div>
                            <div class="card">
                                <h3>Total Neurons (MTD)</h3>
                                <div class="metric">${(ai.mtd_neurons ?? 0).toLocaleString()}</div>
                                <div class="metric-sub">Billable (over 10k/day): ${(ai.mtd_billable_neurons ?? 0).toLocaleString()}</div>
                            </div>
                            <div class="card">
                                <h3>AI Inference Requests (MTD)</h3>
                                <div class="metric">${(ai.mtd_requests ?? 0).toLocaleString()}</div>
                                <div class="metric-sub">Today: ${(ai.daily_requests ?? 0).toLocaleString()} requests</div>
                            </div>
                            <div class="card">
                                <h3>Tokens Processed (MTD)</h3>
                                <div class="metric">${((ai.mtd_input_tokens ?? 0) + (ai.mtd_output_tokens ?? 0)).toLocaleString()}</div>
                                <div class="metric-sub">In: ${(ai.mtd_input_tokens ?? 0).toLocaleString()} | Out: ${(ai.mtd_output_tokens ?? 0).toLocaleString()}</div>
                            </div>
                            <div class="card">
                                <h3>Compute Duration (MTD)</h3>
                                <div class="metric">${((ai.mtd_inference_time_ms ?? 0) / 1000).toFixed(1)} s</div>
                                <div class="metric-sub">$0.011 per 1k billable Neurons</div>
                            </div>
                        </div>

                        <div class="table-wrap">
                            <table class="breakdown-table">
                                <thead>
                                    <tr>
                                        <th>Model ID</th>
                                        <th>Reqs (Today)</th>
                                        <th>Reqs (MTD)</th>
                                        <th>Neurons (MTD)</th>
                                        <th>Input Tokens</th>
                                        <th>Output Tokens</th>
                                        <th>Inference Time</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${aiModelsHtml || '<tr><td colspan="7" style="color:#94a3b8">No Workers AI model invocations recorded this month.</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;

                // 4. Render Shared Global Account D1 Billing & Storage Limits
                const d1Container = document.getElementById('d1-container');
                const d1b = data.d1_billing || {};
                const dbs = data.d1_databases || [];
                const d1ReadPct = d1b.daily_rows_read_pct ?? 0;
                const d1WritePct = d1b.daily_rows_written_pct ?? 0;
                const d1StoPct = d1b.account_storage_pct ?? 0;

                let d1RowsHtml = '';
                dbs.forEach(db => {
                    const pctClass = getQuotaClass(db.capacity_pct ?? 0);
                    d1RowsHtml += `
                        <tr>
                            <td><strong>${db.name}</strong> <span style="color:#94a3b8">(${(db.uuid || '').substring(0, 8)})</span></td>
                            <td>${db.file_size_mb ?? 0} MB <span class="${pctClass}">(${db.capacity_pct ?? 0}% of 500 MB)</span></td>
                            <td>${(db.rows_read_today ?? 0).toLocaleString()}</td>
                            <td>${(db.rows_written_today ?? 0).toLocaleString()}</td>
                            <td>${(db.rows_read ?? 0).toLocaleString()}</td>
                            <td>${(db.rows_written ?? 0).toLocaleString()}</td>
                            <td>${(db.read_queries ?? 0).toLocaleString()} R / ${(db.write_queries ?? 0).toLocaleString()} W</td>
                        </tr>
                    `;
                });

                d1Container.innerHTML = `
                    <div class="domain-section">
                        <div class="domain-title">
                            <span>D1 Serverless SQL Billing &amp; Quotas</span>
                            <span class="subtitle-badge">Est. Billable MTD: $${(d1b.estimated_billable_usd ?? 0).toFixed(2)}</span>
                        </div>
                        <div class="grid">
                            <div class="card">
                                <h3>Daily Rows Read (UTC Quota)</h3>
                                <div class="metric ${getQuotaClass(d1ReadPct)}">${(d1b.daily_rows_read ?? 0).toLocaleString()}</div>
                                <div class="metric-sub">${d1ReadPct}% of ${(d1b.daily_rows_read_limit ?? 5000000).toLocaleString()} / day free</div>
                                <div class="progress-track"><div class="progress-bar ${getProgressClass(d1ReadPct)}" style="width:${clampPct(d1ReadPct)}%"></div></div>
                            </div>
                            <div class="card">
                                <h3>Daily Rows Written (UTC Quota)</h3>
                                <div class="metric ${getQuotaClass(d1WritePct)}">${(d1b.daily_rows_written ?? 0).toLocaleString()}</div>
                                <div class="metric-sub">${d1WritePct}% of ${(d1b.daily_rows_written_limit ?? 100000).toLocaleString()} / day free</div>
                                <div class="progress-track"><div class="progress-bar ${getProgressClass(d1WritePct)}" style="width:${clampPct(d1WritePct)}%"></div></div>
                            </div>
                            <div class="card">
                                <h3>Rows Read (MTD)</h3>
                                <div class="metric">${(d1b.mtd_rows_read ?? 0).toLocaleString()}</div>
                                <div class="metric-sub">Read Queries: ${(d1b.mtd_read_queries ?? 0).toLocaleString()}</div>
                            </div>
                            <div class="card">
                                <h3>Rows Written (MTD)</h3>
                                <div class="metric">${(d1b.mtd_rows_written ?? 0).toLocaleString()}</div>
                                <div class="metric-sub">Write Queries: ${(d1b.mtd_write_queries ?? 0).toLocaleString()}</div>
                            </div>
                            <div class="card">
                                <h3>Total D1 Storage</h3>
                                <div class="metric ${getQuotaClass(d1StoPct)}">${d1b.total_storage_mb ?? 0} MB</div>
                                <div class="metric-sub">${d1StoPct}% of ${(d1b.account_storage_limit_mb ?? 5000).toLocaleString()} MB (5 GB) limit</div>
                                <div class="progress-track"><div class="progress-bar ${getProgressClass(d1StoPct)}" style="width:${clampPct(d1StoPct)}%"></div></div>
                            </div>
                        </div>

                        <div class="table-wrap">
                            <table class="breakdown-table">
                                <thead>
                                    <tr>
                                        <th>Database Cluster</th>
                                        <th>Storage Allocation</th>
                                        <th>Rows Read (Today)</th>
                                        <th>Rows Written (Today)</th>
                                        <th>Rows Read (MTD)</th>
                                        <th>Rows Written (MTD)</th>
                                        <th>SQL Queries (MTD)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${d1RowsHtml || '<tr><td colspan="7" style="color:#94a3b8">No managed D1 storage matrices detected.</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            } catch (err) {
                document.getElementById('daemon-health').innerText = "DISCONNECTED";
                document.getElementById('daemon-health').className = "status-crit";
                const domainsContainer = document.getElementById('domains-container');
                if (!domainsContainer.innerHTML.trim()) {
                    domainsContainer.innerHTML = '<div class="domain-section"><p class="status-crit" style="margin:0;">Unable to load metrics.json. Ensure cloud_monitor_daemon.py is running and index.html is served via HTTP.</p></div>';
                }
            }
        }

        setInterval(updateDashboard, 5000);
        updateDashboard();
    </script>
</body>
</html>
