<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Rounded NOC Badge Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#38bdf8" stroke-width="2.5"/>
  <!-- Radar / Network Grid Rings -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#1e3a5f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="32" cy="32" r="13" fill="none" stroke="#1e3a5f" stroke-width="1.2"/>
  <line x1="10" y1="32" x2="54" y2="32" stroke="#1e3a5f" stroke-width="1"/>
  <line x1="32" y1="10" x2="32" y2="54" stroke="#1e3a5f" stroke-width="1"/>
  <!-- Network Topology Links -->
  <line x1="32" y1="32" x2="17" y2="18" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.75"/>
  <line x1="32" y1="32" x2="48" y2="19" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.75"/>
  <line x1="32" y1="32" x2="47" y2="46" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.75"/>
  <!-- Live Telemetry Pulse Waveform -->
  <polyline points="8,36 18,36 23,24 29,43 35,20 40,36 56,36" fill="none" stroke="#22c55e" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Edge & Core Network Nodes -->
  <circle cx="17" cy="18" r="3.5" fill="#38bdf8"/>
  <circle cx="48" cy="19" r="3.5" fill="#38bdf8"/>
  <circle cx="47" cy="46" r="3.5" fill="#22c55e"/>
  <circle cx="35" cy="20" r="4" fill="#f97316" stroke="#0f172a" stroke-width="1.5"/>
</svg>
